# Local SvelteKit dev environment in a container.
# Loads env vars from .env in the project root.
#
# Usage:
#   docker compose up         # start dev server
#   Ctrl+C                    # stop
#   docker compose down       # remove container

services:
  dev:
    image: node:22-alpine
    container_name: naushadpunjani-dev
    working_dir: /app
    ports:
      - "5174:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules: