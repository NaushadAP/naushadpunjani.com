# Local SvelteKit dev environment in a container.
# No Node, npm, or anything else installed on your host.
#
# Usage:
#   docker compose up         # start dev server
#   Ctrl+C                    # stop
#   docker compose down       # remove container
#   docker compose exec dev npm install <package>   # add a dependency

services:
  dev:
    image: node:22-alpine
    container_name: naushadpunjani-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      # Mount your project folder into /app inside the container
      - .:/app
      # Keep node_modules inside a named volume (fast, avoids Windows FS quirks)
      - node_modules:/app/node_modules
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
